name: quality

# The supply-chain half of the release gate: every dependency (Composer, and
# the npm packages bundled into the compiled CP assets) carries a permissive
# license, sbom.json matches the lock files it was generated from, and no
# runtime dependency has a known advisory. Runs from the committed lock files
# so the SBOM is checked against exactly what ships.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    name: licenses · sbom · audit

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies from the lock file
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Dependency licenses
        run: composer license-check

      - name: SBOM is current
        run: |
          composer sbom
          git diff --exit-code -- sbom.json || { echo "::error::sbom.json is stale — run 'composer sbom' and commit it"; exit 1; }

      - name: Security advisories (runtime dependencies)
        run: composer audit --no-dev

  javascript:
    runs-on: ubuntu-latest
    name: vitest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # The @statamic/cms shim is a `file:` link into vendor/, so Composer's
      # install has to come first for npm ci to resolve the lock file.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install npm dependencies
        run: npm ci --ignore-scripts # dev-only toolchain; esbuild and fsevents ship prebuilt binaries

      - name: Unit tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=moderate
